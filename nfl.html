<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quinielas La Tribuna | NFL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #090a0f; color: #f1f5f9; }
    .btn-pick.active-l {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      color: #ffffff !important;
      border-color: #34d399 !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
      font-weight: 900;
    }
    .btn-pick.active-v {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8) !important;
      color: #ffffff !important;
      border-color: #93c5fd !important;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
      font-weight: 900;
    }
  </style>
</head>
<body class="min-h-screen pb-28 font-sans antialiased">
  <header class="bg-[#0e1017] border-b border-[#232738] pt-4 pb-3 px-4 sticky top-0 z-40 shadow-2xl">
    <div class="max-w-md mx-auto flex flex-col items-center text-center">
      <div class="relative mb-2">
        <div class="w-20 h-20 rounded-full p-1 bg-gradient-to-tr from-amber-500 via-emerald-400 to-amber-300 shadow-xl flex items-center justify-center overflow-hidden bg-[#090a0f]">
          <img src="logo.jpg" alt="Quinielas La Tribuna" class="w-full h-full object-cover rounded-full" onerror="this.src='logo.jpg.jpg'">
        </div>
      </div>
      <h1 class="text-xl font-black tracking-widest text-amber-400 uppercase drop-shadow-md">LA TRIBUNA</h1>
      <p class="text-xs font-black text-emerald-400 tracking-wider uppercase mt-0.5">🏈 QUINIELA NFL</p>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4">
    <div class="grid grid-cols-3 gap-2 mb-4">
      <a href="index.html" class="text-center py-2.5 px-2 rounded-xl text-xs font-bold bg-[#12141c] text-slate-300 border border-[#1e2230]">⚽ Fútbol</a>
      <a href="nfl.html" class="text-center py-2.5 px-2 rounded-xl text-xs font-black bg-emerald-500 text-slate-950 border border-emerald-400">🏈 NFL</a>
      <a href="nba.html" class="text-center py-2.5 px-2 rounded-xl text-xs font-bold bg-[#12141c] text-slate-300 border border-[#1e2230]">🏀 NBA</a>
    </div>

    <div class="bg-[#12141c] border border-amber-500/30 rounded-2xl p-3.5 mb-4 shadow-xl flex justify-between items-center">
      <div>
        <p class="text-xs font-black text-white">$25 MXN por quiniela</p>
        <p class="text-[11px] text-emerald-400 font-bold">Mínimo 2 quinielas ($50 MXN)</p>
      </div>
      <div class="text-right font-black bg-amber-500 text-slate-950 px-2.5 py-1 rounded-lg text-xs">10 JUEGOS</div>
    </div>

    <div class="bg-[#12141c] border border-[#1e2230] rounded-2xl p-4 mb-4">
      <label class="block text-[11px] font-black uppercase tracking-wider text-amber-400 mb-1.5">Nombre del Participante</label>
      <input type="text" id="nombreUsuario" placeholder="Ej. Juan Pérez" class="w-full bg-[#0b0d13] border border-[#232738] rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
    </div>

    <div id="listaPartidos" class="space-y-3"></div>

    <button onclick="agregarQuiniela()" class="w-full mt-4 bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 text-slate-950 font-black py-3.5 rounded-xl text-sm uppercase tracking-wider shadow-lg">
      <i class="fa-solid fa-plus-circle text-base"></i> Registrar Quiniela
    </button>

    <div id="seccionCarrito" class="mt-6 bg-[#12141c] border border-amber-500/40 rounded-2xl p-4 shadow-2xl hidden">
      <div class="flex items-center justify-between mb-3 border-b border-[#1e2230] pb-2.5">
        <h3 class="text-xs font-black uppercase text-amber-400 tracking-wider">Quinielas Registradas</h3>
        <span id="contadorQuinielas" class="text-xs bg-emerald-500 text-slate-950 px-2.5 py-0.5 rounded-full font-black">0</span>
      </div>
      <div id="itemsCarrito" class="space-y-2 mb-4 text-xs"></div>
      <div class="border-t border-[#1e2230] pt-3 flex justify-between items-center mb-4">
        <span class="text-xs text-slate-400 font-bold uppercase">Total:</span>
        <span id="totalPagar" class="text-lg font-black text-emerald-400">$0 MXN</span>
      </div>
      <button onclick="enviarWhatsApp()" class="w-full bg-emerald-500 text-slate-950 font-black py-3.5 rounded-xl uppercase text-sm tracking-wider flex items-center justify-center gap-2">
        <i class="fa-brands fa-whatsapp text-xl"></i> Enviar pedido por WhatsApp
      </button>
    </div>
  </main>

  <script>
    const NUMERO_WHATSAPP = "52XXXXXXXXXX";
    const PRECIO_QUINIELA = 25;

    const partidos = [
      { id: 1, local: "Chiefs", visita: "49ers" },
      { id: 2, local: "Cowboys", visita: "Eagles" },
      { id: 3, local: "Ravens", visita: "Steelers" },
      { id: 4, local: "Bills", visita: "Dolphins" },
      { id: 5, local: "Lions", visita: "Packers" },
      { id: 6, local: "Texans", visita: "Colts" },
      { id: 7, local: "Bengals", visita: "Browns" },
      { id: 8, local: "Seahawks", visita: "Rams" },
      { id: 9, local: "Cardinals", visita: "Chargers" },
      { id: 10, local: "Vikings", visita: "Bears" }
    ];

    let seleccionActual = {};
    let quinielasEnCarrito = [];

    function renderPartidos() {
      document.getElementById("listaPartidos").innerHTML = partidos.map(p => `
        <div class="bg-[#12141c] border border-[#1e2230] rounded-2xl p-3">
          <div class="flex justify-between items-center text-xs font-black text-slate-100 mb-2.5 px-2">
            <span>${p.local}</span>
            <span class="text-[10px] text-amber-400">VS</span>
            <span>${p.visita}</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="elegir(${p.id}, 'L')" id="btn-${p.id}-L" class="btn-pick py-2 text-xs font-bold rounded-xl border border-[#1e2230] bg-[#0b0d13] text-slate-300">Local (L)</button>
            <button onclick="elegir(${p.id}, 'V')" id="btn-${p.id}-V" class="btn-pick py-2 text-xs font-bold rounded-xl border border-[#1e2230] bg-[#0b0d13] text-slate-300">Visita (V)</button>
          </div>
        </div>
      `).join('');
    }

    function elegir(id, opt) {
      seleccionActual[id] = opt;
      document.getElementById(`btn-${id}-L`).className = "btn-pick py-2 text-xs font-bold rounded-xl border border-[#1e2230] bg-[#0b0d13] text-slate-300";
      document.getElementById(`btn-${id}-V`).className = "btn-pick py-2 text-xs font-bold rounded-xl border border-[#1e2230] bg-[#0b0d13] text-slate-300";
      document.getElementById(`btn-${id}-${opt}`).classList.add(opt === 'L' ? 'active-l' : 'active-v');
    }

    function agregarQuiniela() {
      const nombre = document.getElementById("nombreUsuario").value.trim();
      if (!nombre) return alert("Escribe tu nombre.");
      if (Object.keys(seleccionActual).length < partidos.length) return alert("Pronostica todos los partidos.");
      quinielasEnCarrito.push({ nombre, picks: { ...seleccionActual } });
      seleccionActual = {};
      renderPartidos();
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const s = document.getElementById("seccionCarrito");
      if (!quinielasEnCarrito.length) return s.classList.add("hidden");
      s.classList.remove("hidden");
      document.getElementById("contadorQuinielas").innerText = quinielasEnCarrito.length;
      document.getElementById("totalPagar").innerText = `$${quinielasEnCarrito.length * PRECIO_QUINIELA} MXN`;
      document.getElementById("itemsCarrito").innerHTML = quinielasEnCarrito.map((q, i) => `
        <div class="flex justify-between items-center bg-[#0b0d13] px-3 py-2 rounded-xl border border-[#1e2230]">
          <span class="font-bold">Q${i+1}: ${q.nombre}</span>
          <button onclick="quinielasEnCarrito.splice(${i},1);actualizarCarrito();" class="text-rose-400 p-1"><i class="fa-solid fa-trash-can"></i></button>
        </div>
      `).join('');
    }

    function enviarWhatsApp() {
      if (quinielasEnCarrito.length < 2) return alert("Mínimo 2 quinielas.");
      let m = `*🏆 PEDIDO QUINIELAS LA TRIBUNA - NFL*%0ATotal: ${quinielasEnCarrito.length}%0AImporte: $${quinielasEnCarrito.length * PRECIO_QUINIELA} MXN%0A%0A`;
      quinielasEnCarrito.forEach((q, i) => {
        m += `*--- Q#${i+1} (${q.nombre}) ---*%0A`;
        partidos.forEach(p => { m += `${p.id}. ${p.local} vs ${p.visita}: *[${q.picks[p.id]}]*%0A`; });
        m += `%0A`;
      });
      m += `Quedo a la espera de los datos de transferencia.`;
      window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=${m}`, '_blank');
    }

    renderPartidos();
  </script>
</body>
</html>
