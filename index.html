<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quinielas La Tribuna | Fútbol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #090a0f;
      --card-bg: #12141c;
      --green-accent: #10b981;
      --gold-accent: #f59e0b;
    }

    body {
      background-color: var(--bg-main);
      color: #f1f5f9;
    }

    /* Marco redondeado con degradado exacto Oro y Verde Esmeralda */
    .card-partido {
      position: relative;
      background: #11141e;
      border-radius: 1.25rem;
      border: 2px solid transparent;
      background-clip: padding-box;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    }
    .card-partido::before {
      content: '';
      position: absolute;
      top: -2px; bottom: -2px;
      left: -2px; right: -2px;
      background: linear-gradient(135deg, #f59e0b 0%, #10b981 100%);
      border-radius: 1.35rem;
      z-index: -1;
      opacity: 0.85;
      transition: opacity 0.2s ease, box-shadow 0.2s ease;
    }
    .card-partido:hover::before {
      opacity: 1;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
    }

    /* Botones de Selección Activos L - E - V */
    .btn-pick.active-l {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      color: #ffffff !important;
      border-color: #34d399 !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
      font-weight: 900;
    }
    .btn-pick.active-e {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      color: #000000 !important;
      border-color: #fde047 !important;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
      font-weight: 900;
    }
    .btn-pick.active-v {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8) !important;
      color: #ffffff !important;
      border-color: #93c5fd !important;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
      font-weight: 900;
    }

    /* Texto con Degradado Verde Esmeralda y Dorado */
    .brand-title {
      background: linear-gradient(135deg, #10b981 0%, #34d399 30%, #fbbf24 70%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 6px rgba(16, 185, 129, 0.25));
    }
  </style>
</head>
<body class="min-h-screen pb-28 font-sans antialiased">

  <!-- Header Centrado con Logo y Título Refinados -->
  <header class="bg-[#0e1017] border-b border-[#232738] pt-3.5 pb-2.5 px-4 sticky top-0 z-40 shadow-2xl">
    <div class="max-w-md mx-auto flex flex-col items-center text-center">
      
      <!-- Contenedor del Logo -->
      <div class="w-20 h-20 rounded-full p-1 bg-gradient-to-tr from-amber-500 via-emerald-400 to-amber-300 shadow-xl flex items-center justify-center overflow-hidden bg-[#090a0f] mb-1.5">
        <img id="mainLogo" src="logo.jpg" alt="Quinielas La Tribuna" 
             class="w-full h-full object-cover rounded-full"
             onerror="intentarOtroLogo(this)">
      </div>

      <!-- Título Oficial Verde con Dorado -->
      <h1 class="brand-title text-lg font-black tracking-wide uppercase leading-tight">
        LA TRIBUNA QUINIELAS
      </h1>

      <div class="flex items-center gap-2 mt-1">
        <span class="text-[11px] font-black text-emerald-400 tracking-wider uppercase">⚽ QUINIELA FÚTBOL</span>
        <span class="text-slate-600 text-xs">•</span>
        <span class="text-[10px] bg-amber-500/10 text-amber-300 border border-amber-500/30 px-2 py-0.2 rounded-full font-bold">
          JORNADA 14
        </span>
      </div>

    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4">

    <!-- Selector de Deporte -->
    <div class="grid grid-cols-3 gap-2 mb-4">
      <a href="index.html" class="text-center py-2.5 px-2 rounded-xl text-xs font-black bg-emerald-500 text-slate-950 border border-emerald-400 shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-1.5">
        <span>⚽</span> Fútbol
      </a>
      <a href="nfl.html" class="text-center py-2.5 px-2 rounded-xl text-xs font-bold bg-[#12141c] text-slate-300 border border-[#1e2230] hover:border-amber-400/40 flex items-center justify-center gap-1.5 transition">
        <span>🏈</span> NFL
      </a>
      <a href="nba.html" class="text-center py-2.5 px-2 rounded-xl text-xs font-bold bg-[#12141c] text-slate-300 border border-[#1e2230] hover:border-amber-400/40 flex items-center justify-center gap-1.5 transition">
        <span>🏀</span> NBA
      </a>
    </div>

    <!-- Banner Informativo -->
    <div class="card-partido p-3.5 mb-4 flex justify-between items-center">
      <div>
        <p class="text-xs font-black text-white flex items-center gap-1.5">
          <i class="fa-solid fa-trophy text-amber-400"></i> $15 MXN por quiniela
        </p>
        <p class="text-[11px] text-emerald-400 font-bold mt-0.5">Mínimo 2 quinielas por pedido ($30 MXN)</p>
      </div>
      <div class="text-right">
        <span class="text-xs font-black bg-amber-500 text-slate-950 px-2.5 py-1 rounded-lg">11 JUEGOS</span>
      </div>
    </div>

    <!-- Nombre del Participante -->
    <div class="card-partido p-4 mb-4">
      <label class="block text-[11px] font-black uppercase tracking-wider text-amber-400 mb-1.5">
        <i class="fa-solid fa-user text-xs mr-1"></i> Nombre del Participante
      </label>
      <input type="text" id="nombreUsuario" placeholder="Ej. Juan Pérez" 
             class="w-full bg-[#0b0d13] border border-[#232738] rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition">
    </div>

    <!-- Lista de 11 Partidos Oficiales -->
    <div id="listaPartidos" class="space-y-3.5"></div>

    <!-- Panel de Costo Dinámico de la Quiniela Actual (Dobles / Triples) -->
    <div class="mt-4 bg-[#11141e] border border-emerald-500/40 rounded-2xl p-3 flex justify-between items-center shadow-lg">
      <div>
        <span class="text-[11px] text-slate-400 block font-bold uppercase tracking-wider">Pronóstico actual:</span>
        <span id="resumenMultiples" class="text-xs font-black text-amber-400">0 partidos pronosticados</span>
      </div>
      <div class="text-right">
        <span class="text-[10px] text-slate-400 uppercase font-bold block">Costo quiniela:</span>
        <span id="costoActual" class="text-base font-black text-emerald-400">$15 MXN</span>
      </div>
    </div>

    <!-- Botón Agregar Quiniela -->
    <button onclick="agregarQuiniela()" 
            class="w-full mt-3 bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:brightness-110 text-slate-950 font-black py-3.5 rounded-xl transition flex items-center justify-center gap-2 text-sm uppercase tracking-wider shadow-lg shadow-amber-500/20 active:scale-[0.99]">
      <i class="fa-solid fa-plus-circle text-base"></i> Registrar Quiniela
    </button>

    <!-- Resumen y Carrito -->
    <div id="seccionCarrito" class="mt-6 card-partido p-4 hidden">
      <div class="flex items-center justify-between mb-3 border-b border-[#232738] pb-2.5">
        <h3 class="text-xs font-black uppercase text-amber-400 tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-clipboard-check"></i> Quinielas en Carrito
        </h3>
        <span id="contadorQuinielas" class="text-xs bg-emerald-500 text-slate-950 px-2.5 py-0.5 rounded-full font-black">0</span>
      </div>

      <div id="itemsCarrito" class="space-y-2 mb-4 text-xs"></div>

      <div class="border-t border-[#232738] pt-3 flex justify-between items-center mb-4">
        <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Total a pagar:</span>
        <span id="totalPagar" class="text-lg font-black text-emerald-400">$0 MXN</span>
      </div>

      <button onclick="enviarWhatsApp()" 
              class="w-full bg-gradient-to-r from-emerald-500 to-emerald-400 hover:brightness-110 text-slate-950 font-black py-3.5 rounded-xl transition flex items-center justify-center gap-2 text-sm uppercase tracking-wider shadow-lg shadow-emerald-500/25 active:scale-[0.99]">
        <i class="fa-brands fa-whatsapp text-xl"></i> Enviar pedido por WhatsApp
      </button>
    </div>

  </main>

  <script>
    const NUMERO_WHATSAPP = "52XXXXXXXXXX"; // Reemplaza con tus 10 dígitos
    const PRECIO_BASE = 15;

    let intentos = 0;
    const formatosLogo = ["logo.jpg", "logo.png", "logo.jpeg", "logo.jpg.jpg"];
    function intentarOtroLogo(img) {
      intentos++;
      if (intentos < formatosLogo.length) {
        img.src = formatosLogo[intentos];
      }
    }

    // 11 PARTIDOS REALES: JORNADA 14 LIGA MX + EL CLÁSICO + PREMIER LEAGUE
    const partidos = [
      {
        id: 1,
        local: "Necaxa",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/pJ1MKX3vzO7svp-0f984tA_500x500.png",
        visita: "FC Juárez",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/85-dl3QydggPuQl-kc2mtA_500x500.png"
      },
      {
        id: 2,
        local: "Atlante",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/t5LOnqxMCk-QEs20xw8wvw_500x500.png",
        visita: "San Luis",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/ToSdfqXiatX8HuqqVcYgtA_500x500.png"
      },
      {
        id: 3,
        local: "León",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/IR3AyUUEoSWoeTmicHAlKA_500x500.png",
        visita: "Toluca",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/ycTgfmECsg0S-aVXCOPXcA_500x500.png"
      },
      {
        id: 4,
        local: "Monterrey",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/LXZ8fEgzf0_FwSyq15buPw_500x500.png",
        visita: "Chivas",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/9le8bJW_PjNZYbuV3CO2Pg_500x500.png"
      },
      {
        id: 5,
        local: "Pumas UNAM",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/EfPJSBOmHePNwgl6_FOuHA_500x500.png",
        visita: "Tigres",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/SUJAIkxhbnmFXDpJY2gSww_500x500.png"
      },
      {
        id: 6,
        local: "Atlas",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/pl3U9pi7AYOBuIDiyl7vTg_500x500.png",
        visita: "Puebla",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/Xm6-xCbLZ-kNoxWQTen7-Q_500x500.png"
      },
      {
        id: 7,
        local: "América",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/QKZVogU66ByvZRqIAIVtmA_500x500.png",
        visita: "Pachuca",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/9dscoX8iYhzbjSNxXVp2gQ_500x500.png"
      },
      {
        id: 8,
        local: "Querétaro",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/_dJ5qYYoDVTQOvru2Psrlw_500x500.png",
        visita: "Cruz Azul",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/hwsmDtw_ETdVCS410dye3Q_500x500.png"
      },
      {
        id: 9,
        local: "Tijuana",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/LH2XadWT8Nk19o6SnbL4JA_500x500.png",
        visita: "Santos",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/A7Np6PvBdRqYbaHYcVecyg_500x500.png"
      },
      {
        id: 10,
        local: "Barcelona",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/paYnEE8hcrP96neHRNofhQ_500x500.png",
        visita: "Real Madrid",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/Th4fAVAZeCJWRcKoLW7koA_500x500.png"
      },
      {
        id: 11,
        local: "Liverpool",
        logoLocal: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/nGfV05dipbAc7zzojivKew_500x500.png",
        visita: "Brighton",
        logoVisita: "https://ssl.gstatic.com/onebox/media/sports/logos/optimized/EKIe0e-ZIphOcfQAwsuEEQ_500x500.png"
      }
    ];

    let seleccionActual = {};
    let quinielasEnCarrito = [];

    function renderPartidos() {
      const contenedor = document.getElementById("listaPartidos");
      contenedor.innerHTML = partidos.map(p => `
        <div class="card-partido p-3.5">
          <div class="grid grid-cols-11 items-center mb-3 px-1">
            <div class="col-span-5 flex items-center gap-2">
              <img src="${p.logoLocal}" alt="${p.local}" class="w-8 h-8 object-contain drop-shadow" loading="lazy">
              <span class="text-xs font-black text-slate-100 truncate">${p.local}</span>
            </div>
            <div class="col-span-1 text-center">
              <span class="text-[10px] text-amber-400 font-black">VS</span>
            </div>
            <div class="col-span-5 flex items-center justify-end gap-2 text-right">
              <span class="text-xs font-black text-slate-100 truncate">${p.visita}</span>
              <img src="${p.logoVisita}" alt="${p.visita}" class="w-8 h-8 object-contain drop-shadow" loading="lazy">
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="toggleOpcion(${p.id}, 'L')" id="btn-${p.id}-L" 
                    class="btn-pick py-2 text-xs font-bold rounded-xl border border-[#232738] bg-[#0b0d13] text-slate-300 hover:border-slate-500 transition">
              Local (L)
            </button>
            <button type="button" onclick="toggleOpcion(${p.id}, 'E')" id="btn-${p.id}-E" 
                    class="btn-pick py-2 text-xs font-bold rounded-xl border border-[#232738] bg-[#0b0d13] text-slate-300 hover:border-slate-500 transition">
              Empate (E)
            </button>
            <button type="button" onclick="toggleOpcion(${p.id}, 'V')" id="btn-${p.id}-V" 
                    class="btn-pick py-2 text-xs font-bold rounded-xl border border-[#232738] bg-[#0b0d13] text-slate-300 hover:border-slate-500 transition">
              Visita (V)
            </button>
          </div>
        </div>
      `).join('');
      actualizarCalculoCostoActual();
    }

    function toggleOpcion(partidoId, opcion) {
      if (!seleccionActual[partidoId]) {
        seleccionActual[partidoId] = [];
      }

      const index = seleccionActual[partidoId].indexOf(opcion);
      const btn = document.getElementById(`btn-${partidoId}-${opcion}`);

      if (index > -1) {
        seleccionActual[partidoId].splice(index, 1);
        btn.className = "btn-pick py-2 text-xs font-bold rounded-xl border border-[#232738] bg-[#0b0d13] text-slate-300 hover:border-slate-500 transition";
        if (seleccionActual[partidoId].length === 0) {
          delete seleccionActual[partidoId];
        }
      } else {
        seleccionActual[partidoId].push(opcion);
        btn.classList.add(`active-${opcion.toLowerCase()}`);
      }

      actualizarCalculoCostoActual();
    }

    function calcularCostoQuiniela(picks) {
      let combinaciones = 1;
      let countPartidos = 0;

      for (let id = 1; id <= partidos.length; id++) {
        if (picks[id] && picks[id].length > 0) {
          combinaciones *= picks[id].length;
          countPartidos++;
        }
      }

      return {
        combinaciones,
        costo: combinaciones * PRECIO_BASE,
        completos: countPartidos === partidos.length,
        countPartidos
      };
    }

    function actualizarCalculoCostoActual() {
      const calc = calcularCostoQuiniela(seleccionActual);
      const txtResumen = document.getElementById("resumenMultiples");
      const txtCosto = document.getElementById("costoActual");

      let dobles = 0;
      let triples = 0;
      Object.values(seleccionActual).forEach(arr => {
        if (arr.length === 2) dobles++;
        if (arr.length === 3) triples++;
      });

      let detalle = `${calc.countPartidos}/${partidos.length} listos`;
      if (dobles > 0 || triples > 0) {
        detalle += ` (${dobles}D, ${triples}T = ${calc.combinaciones} comb)`;
      }

      txtResumen.innerText = detalle;
      txtCosto.innerText = `$${calc.costo} MXN`;
    }

    function agregarQuiniela() {
      const nombre = document.getElementById("nombreUsuario").value.trim();
      if (!nombre) {
        alert("Por favor escribe tu nombre completo.");
        return;
      }

      const calc = calcularCostoQuiniela(seleccionActual);
      if (!calc.completos) {
        alert(`Debes pronosticar al menos una opción en los ${partidos.length} partidos.`);
        return;
      }

      const copiaPicks = {};
      for (const k in seleccionActual) {
        copiaPicks[k] = [...seleccionActual[k]];
      }

      quinielasEnCarrito.push({
        nombre: nombre,
        picks: copiaPicks,
        costo: calc.costo,
        combinaciones: calc.combinaciones
      });

      seleccionActual = {};
      renderPartidos();
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const seccion = document.getElementById("seccionCarrito");
      const contenedor = document.getElementById("itemsCarrito");
      const total = document.getElementById("totalPagar");
      const contador = document.getElementById("contadorQuinielas");

      if (quinielasEnCarrito.length === 0) {
        seccion.classList.add("hidden");
        return;
      }

      seccion.classList.remove("hidden");
      contador.innerText = quinielasEnCarrito.length;

      const sumaTotal = quinielasEnCarrito.reduce((acc, q) => acc + q.costo, 0);
      total.innerText = `$${sumaTotal} MXN`;

      contenedor.innerHTML = quinielasEnCarrito.map((q, idx) => `
        <div class="flex justify-between items-center bg-[#0b0d13] px-3 py-2 rounded-xl border border-[#232738]">
          <div>
            <span class="font-bold text-slate-200">Q${idx + 1}: ${q.nombre}</span>
            <span class="text-[10px] text-amber-400 block">${q.combinaciones > 1 ? `(${q.combinaciones} combinaciones) -$${q.costo} MXN` : `$${q.costo} MXN`}</span>
          </div>
          <button onclick="eliminarQuiniela(${idx})" class="text-rose-400 hover:text-rose-300 p-1">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `).join('');
    }

    function eliminarQuiniela(index) {
      quinielasEnCarrito.splice(index, 1);
      actualizarCarrito();
    }

    function enviarWhatsApp() {
      const sumaTotal = quinielasEnCarrito.reduce((acc, q) => acc + q.costo, 0);
      if (sumaTotal < 30) {
        alert("El pedido mínimo son $30 MXN (pueden ser 2 quinielas sencillas o 1 con dobles).");
        return;
      }

      let mensaje = `*🏆 PEDIDO QUINIELAS LA TRIBUNA - FÚTBOL*%0A`;
      mensaje += `*Jornada:* JORNADA 14%0A`;
      mensaje += `*Total quinielas:* ${quinielasEnCarrito.length}%0A`;
      mensaje += `*Importe total:* $${sumaTotal} MXN%0A%0A`;

      quinielasEnCarrito.forEach((q, idx) => {
        mensaje += `*--- QUINIELA #${idx + 1} (${q.nombre}) - $${q.costo} MXN ---*%0A`;
        partidos.forEach(p => {
          const picksPartido = q.picks[p.id].join('-');
          mensaje += `${p.id}. ${p.local} vs ${p.visita}: *[${picksPartido}]*%0A`;
        });
        mensaje += `%0A`;
      });

      mensaje += `Quedo a la espera de los datos de transferencia.`;

      const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensaje}`;
      window.open(url, '_blank');
    }

    document.addEventListener("DOMContentLoaded", renderPartidos);
    renderPartidos();
  </script>
</body>
</html>
