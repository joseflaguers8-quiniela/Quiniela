<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quinielas La Tribuna | Fútbol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Estilos basados en la identidad visual del logo oficial */
    :root {
      --bg-stadium: #090f1d;
      --card-stadium: #0f1a30;
      --gold-primary: #f59e0b;
      --green-primary: #10b981;
    }

    body {
      background-color: var(--bg-stadium);
    }

    /* Iluminación de selección activa para cada botón */
    .btn-pick.active-l {
      background-color: #10b981 !important;
      color: #ffffff !important;
      border-color: #34d399 !important;
      font-weight: 900;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }
    .btn-pick.active-e {
      background-color: #f59e0b !important;
      color: #0f172a !important;
      border-color: #fbbf24 !important;
      font-weight: 900;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }
    .btn-pick.active-v {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border-color: #60a5fa !important;
      font-weight: 900;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen pb-24 font-sans antialiased">

  <!-- Header Oficial con Logo y Borde Dorado -->
  <header class="bg-[#0c1527] border-b border-amber-500/30 py-3 px-4 sticky top-0 z-40 shadow-xl">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Logo circular con marco de gradas/trofeo -->
        <div class="w-12 h-12 rounded-full p-0.5 bg-gradient-to-tr from-amber-500 to-emerald-400 shadow-md flex items-center justify-center">
          <img src="logo.png" alt="Quinielas La Tribuna" class="w-full h-full object-cover rounded-full bg-[#0c1527]">
        </div>
        <div>
          <h1 class="text-base font-black tracking-wider text-amber-400 uppercase leading-none drop-shadow-sm">LA TRIBUNA</h1>
          <p class="text-[11px] font-bold text-emerald-400 tracking-wide uppercase mt-0.5">Quinielas Deportivas</p>
        </div>
      </div>
      <div class="text-right">
        <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/40 px-2.5 py-1 rounded-full font-black tracking-wide">
          JORNADA 1
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4">

    <!-- Menú Selector Multideporte -->
    <div class="flex justify-center gap-2 mb-4">
      <a href="index.html" class="flex-1 text-center py-2 px-2 rounded-xl text-xs font-black bg-emerald-500 text-slate-950 border border-emerald-400 shadow-md shadow-emerald-500/20">
        ⚽ Fútbol
      </a>
      <a href="nfl.html" class="flex-1 text-center py-2 px-2 rounded-xl text-xs font-bold bg-[#0f1a30] text-slate-400 border border-slate-800 hover:border-amber-500/40">
        🏈 NFL
      </a>
      <a href="nba.html" class="flex-1 text-center py-2 px-2 rounded-xl text-xs font-bold bg-[#0f1a30] text-slate-400 border border-slate-800 hover:border-amber-500/40">
        🏀 NBA
      </a>
    </div>

    <!-- Reglas y Tarifa de la Quiniela -->
    <div class="bg-gradient-to-r from-[#0f1a30] to-[#122244] border border-amber-500/30 rounded-2xl p-3.5 mb-4 shadow-lg flex justify-between items-center">
      <div>
        <p class="text-xs font-bold text-white flex items-center gap-1.5">
          <i class="fa-solid fa-trophy text-amber-400 text-xs"></i> Costo: $25 MXN por quiniela
        </p>
        <p class="text-[11px] text-slate-400 mt-0.5">Mínimo 2 quinielas por pedido ($50 MXN)</p>
      </div>
      <div class="text-right">
        <span class="text-xs font-black text-amber-400">12 JUEGOS</span>
      </div>
    </div>

    <!-- Nombre del Participante -->
    <div class="bg-[#0f1a30] border border-slate-800 rounded-2xl p-4 mb-4 shadow-md">
      <label class="block text-[11px] font-black uppercase tracking-wider text-amber-400/90 mb-1.5">
        Nombre del Participante
      </label>
      <input type="text" id="nombreUsuario" placeholder="Ej. Juan Pérez" 
             class="w-full bg-[#080e1a] border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition">
    </div>

    <!-- Cartelera de Partidos (12 Partidos) -->
    <div id="listaPartidos" class="space-y-3">
      <!-- Se generan automáticamente por JavaScript -->
    </div>

    <!-- Botón Agregar Quiniela al Carrito -->
    <button onclick="agregarQuiniela()" 
            class="w-full mt-4 bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black py-3.5 rounded-xl transition flex items-center justify-center gap-2 text-sm uppercase tracking-wider shadow-lg shadow-amber-500/20 active:scale-[0.99]">
      <i class="fa-solid fa-plus text-base"></i> Registrar Quiniela
    </button>

    <!-- Resumen y Checkout para WhatsApp -->
    <div id="seccionCarrito" class="mt-6 bg-[#0f1a30] border border-amber-500/30 rounded-2xl p-4 shadow-xl hidden">
      <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2.5">
        <h3 class="text-xs font-black uppercase text-amber-400 tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-clipboard-check"></i> Quinielas en Carrito
        </h3>
        <span id="contadorQuinielas" class="text-xs bg-emerald-500 text-slate-950 px-2 py-0.5 rounded-full font-black">0</span>
      </div>

      <div id="itemsCarrito" class="space-y-2 mb-4 text-xs"></div>

      <div class="border-t border-slate-800 pt-3 flex justify-between items-center mb-4">
        <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Total a pagar:</span>
        <span id="totalPagar" class="text-base font-black text-emerald-400">$0 MXN</span>
      </div>

      <!-- Botón de Envío Directo a WhatsApp -->
      <button onclick="enviarWhatsApp()" 
              class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl transition flex items-center justify-center gap-2 text-sm uppercase tracking-wider shadow-lg shadow-emerald-500/25 active:scale-[0.99]">
        <i class="fa-brands fa-whatsapp text-lg"></i> Enviar pedido por WhatsApp
      </button>
    </div>

  </main>

  <script>
    // ==========================================
    // CONFIGURACIÓN OFICIAL
    // ==========================================
    // Reemplaza los dígitos con tu número de WhatsApp (52 + 10 dígitos)
    const NUMERO_WHATSAPP = "52XXXXXXXXXX"; 
    const PRECIO_QUINIELA = 25;

    // Lista de 12 partidos para la jornada
    const partidos = [
      { id: 1, local: "América", visita: "Guadalajara" },
      { id: 2, local: "Cruz Azul", visita: "Pumas UNAM" },
      { id: 3, local: "Tigres UANL", visita: "Monterrey" },
      { id: 4, local: "Toluca", visita: "Pachuca" },
      { id: 5, local: "Santos Laguna", visita: "Atlas" },
      { id: 6, local: "León", visita: "Necaxa" },
      { id: 7, local: "Puebla", visita: "FC Juárez" },
      { id: 8, local: "Tijuana", visita: "Querétaro" },
      { id: 9, local: "Atlético San Luis", visita: "Mazatlán" },
      { id: 10, local: "Real Madrid", visita: "Barcelona" },
      { id: 11, local: "Liverpool", visita: "Manchester City" },
      { id: 12, local: "Arsenal", visita: "Chelsea" }
    ];

    let seleccionActual = {};
    let quinielasEnCarrito = [];

    // Pintar los partidos en la pantalla
    function renderPartidos() {
      const contenedor = document.getElementById("listaPartidos");
      contenedor.innerHTML = partidos.map(p => `
        <div class="bg-[#0f1a30] border border-slate-800 rounded-2xl p-3 shadow-sm hover:border-slate-700 transition">
          <div class="flex justify-between items-center text-xs font-black text-slate-200 mb-2 px-1">
            <span class="truncate w-5/12 text-left">${p.local}</span>
            <span class="text-[10px] text-amber-400/80 uppercase font-black">VS</span>
            <span class="truncate w-5/12 text-right">${p.visita}</span>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="elegir(${p.id}, 'L')" id="btn-${p.id}-L" 
                    class="btn-pick py-2 text-xs font-bold rounded-xl border border-slate-700/80 bg-[#080e1a] text-slate-300 hover:border-slate-500 transition">
              Local (L)
            </button>
            <button onclick="elegir(${p.id}, 'E')" id="btn-${p.id}-E" 
                    class="btn-pick py-2 text-xs font-bold rounded-xl border border-slate-700/80 bg-[#080e1a] text-slate-300 hover:border-slate-500 transition">
              Empate (E)
            </button>
            <button onclick="elegir(${p.id}, 'V')" id="btn-${p.id}-V" 
                    class="btn-pick py-2 text-xs font-bold rounded-xl border border-slate-700/80 bg-[#080e1a] text-slate-300 hover:border-slate-500 transition">
              Visita (V)
            </button>
          </div>
        </div>
      `).join('');
    }

    // Gestionar la selección del usuario
    function elegir(partidoId, opcion) {
      seleccionActual[partidoId] = opcion;
      
      ['L', 'E', 'V'].forEach(opt => {
        const btn = document.getElementById(`btn-${partidoId}-${opt}`);
        btn.className = "btn-pick py-2 text-xs font-bold rounded-xl border border-slate-700/80 bg-[#080e1a] text-slate-300 hover:border-slate-500 transition";
      });

      const btnActivo = document.getElementById(`btn-${partidoId}-${opcion}`);
      btnActivo.classList.add(`active-${opcion.toLowerCase()}`);
    }

    // Guardar la quiniela actual en el carrito
    function agregarQuiniela() {
      const nombre = document.getElementById("nombreUsuario").value.trim();
      if (!nombre) {
        alert("Por favor escribe tu nombre completo para identificar tu quiniela.");
        return;
      }
      if (Object.keys(seleccionActual).length < partidos.length) {
        alert(`Debes pronosticar los ${partidos.length} partidos antes de agregar.`);
        return;
      }

      quinielasEnCarrito.push({
        nombre: nombre,
        picks: { ...seleccionActual }
      });

      // Reiniciar formulario para la siguiente quiniela
      seleccionActual = {};
      renderPartidos();
      actualizarCarrito();
    }

    // Actualizar la lista y total del carrito
    function actualizarCarrito() {
      const seccion = document.getElementById("seccionCarrito");
      const contenedor = document.getElementById("itemsCarrito");
      const total = document.getElementById("totalPagar");
      const contador = document.getElementById("contadorQuinielas");

      if (quinielasEnCarrito.length === 0) {
        seccion.classList.add("hidden");
        return;
      }

      seccion.classList.remove("hidden");
      contador.innerText = quinielasEnCarrito.length;
      total.innerText = `$${quinielasEnCarrito.length * PRECIO_QUINIELA} MXN`;

      contenedor.innerHTML = quinielasEnCarrito.map((q, idx) => `
        <div class="flex justify-between items-center bg-[#080e1a] px-3 py-2 rounded-xl border border-slate-800">
          <span class="font-bold text-slate-200">Q${idx + 1}: ${q.nombre}</span>
          <button onclick="eliminarQuiniela(${idx})" class="text-rose-400 hover:text-rose-300 p-1" title="Eliminar">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `).join('');
    }

    function eliminarQuiniela(index) {
      quinielasEnCarrito.splice(index, 1);
      actualizarCarrito();
    }

    // Abrir WhatsApp con el pedido estructurado
    function enviarWhatsApp() {
      if (quinielasEnCarrito.length < 2) {
        alert("Recuerda que la participación mínima son 2 quinielas ($50 MXN).");
        return;
      }

      let mensaje = `*🏆 PEDIDO QUINIELAS LA TRIBUNA - FÚTBOL*%0A`;
      mensaje += `*Total quinielas:* ${quinielasEnCarrito.length}%0A`;
      mensaje += `*Importe total:* $${quinielasEnCarrito.length * PRECIO_QUINIELA} MXN%0A%0A`;

      quinielasEnCarrito.forEach((q, idx) => {
        mensaje += `*--- QUINIELA #${idx + 1} (${q.nombre}) ---*%0A`;
        partidos.forEach(p => {
          mensaje += `${p.id}. ${p.local} vs ${p.visita}: *[${q.picks[p.id]}]*%0A`;
        });
        mensaje += `%0A`;
      });

      mensaje += `Quedo a la espera de la cuenta para transferir y recibir mi confirmación.`;

      const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensaje}`;
      window.open(url, '_blank');
    }

    renderPartidos();
  </script>
</body>
</html>
