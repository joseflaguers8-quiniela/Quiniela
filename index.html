<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiniela de Fútbol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-32">

  <!-- Encabezado -->
  <header class="bg-slate-800 border-b border-slate-700 py-4 px-4 sticky top-0 z-20 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-lg font-black tracking-wide text-emerald-400 uppercase">Quiniela MX</h1>
        <p class="text-xs text-slate-400">Jornada Activa • $25 MXN c/u (Mínimo 2)</p>
      </div>
      <span class="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-2.5 py-1 rounded-full border border-emerald-500/20">
        Activa
      </span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- Datos del Participante -->
    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-sm space-y-3">
      <h2 class="text-sm font-semibold text-slate-300">1. Tus Datos</h2>
      <div>
        <label for="nombre" class="block text-xs text-slate-400 mb-1">Nombre o Apodo con el que juegas:</label>
        <input 
          type="text" 
          id="nombre" 
          placeholder="Ej. Juan Pérez" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
          required
        >
      </div>
    </section>

    <!-- Lista de Partidos -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-300">2. Llena tu jugada</h2>
        <span class="text-xs text-slate-400" id="costoActual">Costo: $0 MXN</span>
      </div>
      <div id="contenedorPartidos" class="space-y-3">
        <!-- Inyección JS -->
      </div>
      
      <!-- Botón para Agregar a la Lista -->
      <button 
        type="button" 
        onclick="agregarQuinielaALista()" 
        class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-emerald-400 font-bold text-sm rounded-xl border border-emerald-500/30 flex items-center justify-center gap-2 transition-all active:scale-95 shadow"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span>AGREGAR QUINIELA A LA LISTA</span>
      </button>
    </section>

    <!-- Lista de Quinielas Agregadas -->
    <section class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-300">3. Quinielas Agregadas</h2>
        <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full" id="contadorLista">0 / 2 mín.</span>
      </div>
      
      <div id="listaAgregadas" class="space-y-2">
        <p class="text-xs text-slate-500 italic text-center py-3">Aún no has agregado ninguna quiniela. Llena tus opciones y presiona "Agregar".</p>
      </div>
    </section>

  </main>

  <!-- Barra Fija Inferior: Resumen y Botón de Envío -->
  <footer class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 p-4 z-30">
    <div class="max-w-md mx-auto flex items-center justify-between gap-4">
      <div>
        <p class="text-xs text-slate-400">Total a pagar:</p>
        <p class="text-xl font-black text-emerald-400" id="granTotal">$0 MXN</p>
        <p class="text-[10px] text-slate-400" id="resumenQuinielas">0 quinielas listas</p>
      </div>
      <button 
        type="button" 
        id="btnEnviarWhatsapp"
        onclick="enviarAWhatsApp()" 
        disabled
        class="bg-slate-700 text-slate-400 cursor-not-allowed font-bold px-5 py-3 rounded-xl text-sm flex items-center gap-2 transition-all shadow-lg"
      >
        <span>Enviar a WhatsApp</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
        </svg>
      </button>
    </div>
  </footer>

  <script>
    const PRECIO_BASE = 25;
    const NUMERO_WHATSAPP = "521XXXXXXXXXX"; // Cambiar por tu número cuando lo tengas

    const partidos = [
      { id: 1, local: "América", visita: "Chivas" },
      { id: 2, local: "Cruz Azul", visita: "Pumas" },
      { id: 3, local: "Tigres", visita: "Monterrey" },
      { id: 4, local: "Toluca", visita: "León" },
      { id: 5, local: "Pachuca", visita: "Atlas" },
      { id: 6, local: "Santos", visita: "Necaxa" },
      { id: 7, local: "Tijuana", visita: "Mazatlán" },
      { id: 8, local: "Querétaro", visita: "Juárez" },
      { id: 9, local: "Atl. San Luis", visita: "Puebla" }
    ];

    let pronosticoActual = {};
    const listaQuinielas = [];

    function renderPartidos() {
      const contenedor = document.getElementById('contenedorPartidos');
      contenedor.innerHTML = "";
      partidos.forEach(p => {
        pronosticoActual[p.id] = [];
        const card = document.createElement('div');
        card.className = "bg-slate-800 rounded-xl p-3 border border-slate-700/80 space-y-2";
        card.innerHTML = `
          <div class="flex items-center justify-between text-xs text-slate-400 border-b border-slate-700/50 pb-1.5">
            <span class="font-medium text-slate-300">Partido ${p.id}</span>
            <span class="text-[11px] bg-slate-700 px-2 py-0.5 rounded text-slate-300">L - E - V</span>
          </div>
          <div class="grid grid-cols-3 gap-2 items-center text-center">
            <span class="text-xs font-semibold text-white truncate text-right">${p.local}</span>
            <span class="text-[10px] text-slate-500 font-bold uppercase">vs</span>
            <span class="text-xs font-semibold text-white truncate text-left">${p.visita}</span>
          </div>
          <div class="grid grid-cols-3 gap-2 pt-1" id="grupo-botones-${p.id}">
            <button type="button" onclick="marcar(${p.id}, 'L', this)" class="btn-opcion py-2 rounded-lg text-xs font-bold bg-slate-900 border border-slate-700 text-slate-300 active:scale-95 transition-all">L</button>
            <button type="button" onclick="marcar(${p.id}, 'E', this)" class="btn-opcion py-2 rounded-lg text-xs font-bold bg-slate-900 border border-slate-700 text-slate-300 active:scale-95 transition-all">E</button>
            <button type="button" onclick="marcar(${p.id}, 'V', this)" class="btn-opcion py-2 rounded-lg text-xs font-bold bg-slate-900 border border-slate-700 text-slate-300 active:scale-95 transition-all">V</button>
          </div>
        `;
        contenedor.appendChild(card);
      });
      actualizarCostoActual();
    }

    function marcar(partidoId, opcion, elemento) {
      const index = pronosticoActual[partidoId].indexOf(opcion);
      if (index > -1) {
        pronosticoActual[partidoId].splice(index, 1);
        elemento.classList.remove('bg-emerald-500', 'text-slate-950', 'border-emerald-400');
        elemento.classList.add('bg-slate-900', 'text-slate-300', 'border-slate-700');
      } else {
        pronosticoActual[partidoId].push(opcion);
        elemento.classList.remove('bg-slate-900', 'text-slate-300', 'border-slate-700');
        elemento.classList.add('bg-emerald-500', 'text-slate-950', 'border-emerald-400');
      }
      actualizarCostoActual();
    }

    function getCombinacionesActual() {
      let combs = 1;
      for (let p of partidos) {
        const count = pronosticoActual[p.id].length;
        if (count === 0) return 0;
        combs *= count;
      }
      return combs;
    }

    function actualizarCostoActual() {
      const combs = getCombinacionesActual();
      const costo = combs * PRECIO_BASE;
      document.getElementById('costoActual').textContent = combs > 0 ? `Costo: $${costo} MXN (${combs} comb.)` : `Costo: $0 MXN`;
    }

    function limpiarSeleccionActual() {
      partidos.forEach(p => {
        pronosticoActual[p.id] = [];
        const btnGroup = document.getElementById(`grupo-botones-${p.id}`);
        const botones = btnGroup.querySelectorAll('button');
        botones.forEach(btn => {
          btn.classList.remove('bg-emerald-500', 'text-slate-950', 'border-emerald-400');
          btn.classList.add('bg-slate-900', 'text-slate-300', 'border-slate-700');
        });
      });
      actualizarCostoActual();
    }

    function agregarQuinielaALista() {
      for (let p of partidos) {
        if (pronosticoActual[p.id].length === 0) {
          alert(`Falta seleccionar el resultado para el Partido ${p.id}: ${p.local} vs ${p.visita}`);
          return;
        }
      }

      const copiaPronostico = {};
      partidos.forEach(p => {
        copiaPronostico[p.id] = [...pronosticoActual[p.id]].sort();
      });

      const combs = getCombinacionesActual();
      const costo = combs * PRECIO_BASE;

      listaQuinielas.push({
        pronosticos: copiaPronostico,
        combinaciones: combs,
        costo: costo
      });

      limpiarSeleccionActual();
      actualizarVistaLista();
    }

    function eliminarQuiniela(index) {
      listaQuinielas.splice(index, 1);
      actualizarVistaLista();
    }

    function actualizarVistaLista() {
      const contenedorLista = document.getElementById('listaAgregadas');
      const contador = document.getElementById('contadorLista');
      const granTotalElement = document.getElementById('granTotal');
      const resumenElement = document.getElementById('resumenQuinielas');
      const btnEnviar = document.getElementById('btnEnviarWhatsapp');

      if (listaQuinielas.length === 0) {
        contenedorLista.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-3">Aún no has agregado ninguna quiniela. Llena tus opciones y presiona "Agregar".</p>`;
        contador.textContent = "0 / 2 mín.";
        granTotalElement.textContent = "$0 MXN";
        resumenElement.textContent = "0 quinielas listas";
        btnEnviar.disabled = true;
        btnEnviar.className = "bg-slate-700 text-slate-400 cursor-not-allowed font-bold px-5 py-3 rounded-xl text-sm flex items-center gap-2 transition-all shadow-lg";
        return;
      }

      let totalPagar = 0;
      let totalQuinielas = 0;
      let html = "";

      listaQuinielas.forEach((q, idx) => {
        totalPagar += q.costo;
        totalQuinielas += q.combinaciones;

        const resumenJugadas = partidos.map(p => `${p.id}:${q.pronosticos[p.id].join('/')}`).join(' | ');

        html += `
          <div class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 flex items-center justify-between text-xs">
            <div class="space-y-0.5 truncate mr-2">
              <span class="font-bold text-emerald-400">Quiniela #${idx + 1}</span> 
              <span class="text-slate-400 text-[11px]">($${q.costo} MXN)</span>
              <p class="text-[10px] text-slate-400 truncate">${resumenJugadas}</p>
            </div>
            <button onclick="eliminarQuiniela(${idx})" class="text-red-400 hover:text-red-300 p-1 text-xs font-semibold">
              Quitar
            </button>
          </div>
        `;
      });

      contenedorLista.innerHTML = html;
      contador.textContent = `${listaQuinielas.length} / 2 mín.`;
      granTotalElement.textContent = `$${totalPagar.toLocaleString('es-MX')} MXN`;
      resumenElement.textContent = `${totalQuinielas} quiniela(s) en juego`;

      // Validar si cumple el mínimo de 2 quinielas
      if (listaQuinielas.length >= 2) {
        btnEnviar.disabled = false;
        btnEnviar.className = "bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 py-3 rounded-xl text-sm flex items-center gap-2 transition-all shadow-lg shadow-emerald-500/20 active:scale-95 cursor-pointer";
      } else {
        btnEnviar.disabled = true;
        btnEnviar.className = "bg-slate-700 text-slate-400 cursor-not-allowed font-bold px-5 py-3 rounded-xl text-sm flex items-center gap-2 transition-all shadow-lg";
      }
    }

    function enviarAWhatsApp() {
      const nombre = document.getElementById('nombre').value.trim();
      if (!nombre) {
        alert("Por favor escribe tu nombre o apodo antes de enviar.");
        return;
      }

      if (listaQuinielas.length < 2) {
        alert("La participación mínima es de 2 quinielas.");
        return;
      }

      const folio = "Q-" + Math.floor(1000 + Math.random() * 9000);
      let totalPagar = 0;
      let totalCombinaciones = 0;
      listaQuinielas.forEach(q => {
        totalPagar += q.costo;
        totalCombinaciones += q.combinaciones;
      });

      let texto = `*REGISTRO DE QUINIELAS*\n`;
      texto += `*Folio:* ${folio}\n`;
      texto += `*Participante:* ${nombre}\n`;
      texto += `*Total quinielas:* ${totalCombinaciones} (${listaQuinielas.length} boletos)\n`;
      texto += `*Total a pagar:* $${totalPagar} MXN\n`;
      texto += `----------------------------\n`;

      listaQuinielas.forEach((q, idx) => {
        texto += `\n*QUINIELA #${idx + 1} ($${q.costo} MXN):*\n`;
        partidos.forEach(p => {
          const eleccion = q.pronosticos[p.id].join('/');
          texto += `• ${p.id}. ${p.local} vs ${p.visita} ➔ *[${eleccion}]*\n`;
        });
      });

      texto += `\n----------------------------\n`;
      texto += `En seguida te envío la captura de mi comprobante de pago por transferencia.`;

      const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');
    }

    renderPartidos();
  </script>
</body>
</html>
